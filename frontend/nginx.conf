server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ^~ e nao /api/: a forma com barra nao casa o caminho nu /api, que cairia no
    # catch-all da SPA e devolveria index.html com 200 no lugar do JSON de erro.
    location ^~ /api {
        # O DNS interno do Docker resolvido em runtime. Com hostname literal no proxy_pass o
        # nginx resolve uma vez no boot e cacheia o IP; recriar o container `api` daria 502 ate
        # reiniciar o `web`.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8080;

        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
